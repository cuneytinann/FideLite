<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-label="Bitişlerin boru hattı: hamleden sonra legal hamle sorusu, otomatik beraberlikler ve istek kapısı; oyun sürerken süre ve terk kolu" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
