  <title>FideLite</title>
  <!--
    5x5, merkezden vezir hamlesi.
    hücre 48, çizgi 4, adım 52  ->  4 56 108 160 212
    bordo çerçeve 3x3 ızgara çizgilerinin tam ortasında (54..210), kalınlık 6
  -->

  <!-- ızgara: tek plaka, hücreler üstüne biniyor (dikiş/hairline yok) -->
  <rect width="264" height="264" fill="#a8916b"/>

  <!-- at kareleri -->
  <g fill="#1c1714">
    <rect x="56"  y="4"   width="48" height="48"/>
    <rect x="160" y="4"   width="48" height="48"/>
    <rect x="4"   y="56"  width="48" height="48"/>
    <rect x="212" y="56"  width="48" height="48"/>
    <rect x="4"   y="160" width="48" height="48"/>
    <rect x="212" y="160" width="48" height="48"/>
    <rect x="56"  y="212" width="48" height="48"/>
    <rect x="160" y="212" width="48" height="48"/>
  </g>

  <!-- kale kareleri -->
  <g fill="#7ab6c9">
    <rect x="108" y="4"   width="48" height="48"/>
    <rect x="108" y="56"  width="48" height="48"/>
    <rect x="4"   y="108" width="48" height="48"/>
    <rect x="56"  y="108" width="48" height="48"/>
    <rect x="160" y="108" width="48" height="48"/>
    <rect x="212" y="108" width="48" height="48"/>
    <rect x="108" y="160" width="48" height="48"/>
    <rect x="108" y="212" width="48" height="48"/>
  </g>

  <!-- fil kareleri -->
  <g fill="#c895c4">
    <rect x="4"   y="4"   width="48" height="48"/>
    <rect x="212" y="4"   width="48" height="48"/>
    <rect x="56"  y="56"  width="48" height="48"/>
    <rect x="160" y="56"  width="48" height="48"/>
    <rect x="56"  y="160" width="48" height="48"/>
    <rect x="160" y="160" width="48" height="48"/>
    <rect x="4"   y="212" width="48" height="48"/>
    <rect x="212" y="212" width="48" height="48"/>
  </g>

  <!-- merkez -->
  <rect x="108" y="108" width="48" height="48" fill="#ece3d8"/>

